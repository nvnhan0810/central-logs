[package]
name = "central_logs_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
