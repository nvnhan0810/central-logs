[package]
name = "central_logs_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
